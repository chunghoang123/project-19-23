<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Hệ thống rạp')}"></head>
<body>

<header th:replace="~{fragments/layout :: header('cinemas')}"></header>

<main class="container">

    <div th:replace="~{fragments/layout :: flash}"></div>
    <section class="section">
        <div class="section-head">
            <div>
                <h2 class="section-title">Hệ thống rạp CineX</h2>
                <p class="section-sub" th:text="${total} + ' chi nhánh trên toàn quốc'">45 chi nhánh</p>
            </div>
        </div>

        <div th:each="entry : ${grouped}">
            <h3 style="margin:30px 0 14px;font-size:18px" th:text="${entry.key}">Tỉnh</h3>
            <div class="movie-grid" style="grid-template-columns:repeat(auto-fill,minmax(280px,1fr))">
                <a class="card card-body" th:each="cinema : ${entry.value}"
                   th:href="@{/cinemas/{id}(id=${cinema.id})}">
                    <div style="font-weight:700;margin-bottom:6px" th:text="${cinema.name}">Rạp</div>
                    <div style="color:var(--text-dim);font-size:13px" th:text="${cinema.address}">Địa chỉ</div>
                    <div style="margin-top:10px">
                        <span class="badge" th:text="${cinema.brand}">CineX</span>
                    </div>
                </a>
            </div>
        </div>
    </section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
