<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Chọn ghế')}"></head>
<body>

<header th:replace="~{fragments/layout :: header('showtimes')}"></header>

<main class="container">

    <div th:replace="~{fragments/layout :: flash}"></div>
    <section class="section">
        <div class="section-head">
            <div>
                <h2 class="section-title">Chọn ghế</h2>
                <p class="section-sub">
                    <span th:text="${showtime.movie.title}">Phim</span>
                    · <span th:text="${showtime.cinema.name}">Rạp</span>
                    · <span th:text="${showtime.screen.name}">Phòng</span>
                    ·
                    <span th:text="${#temporals.format(showtime.startTime, 'HH:mm dd/MM/yyyy')}">19:00 01/01/2026</span>
                </p>
            </div>
            <a class="btn btn-outline btn-sm" th:href="@{/showtimes}">← Quay lại lịch chiếu</a>
        </div>

        <div class="detail-layout">
            <div>
                <div class="card card-body">
                    <div style="font-weight:700;margin-bottom:12px">Thông tin suất chiếu</div>
                    <dl class="kv" style="margin:0">
                        <dt>Phim</dt>
                        <dd th:text="${showtime.movie.title}">—</dd>
                        <dt>Định dạng</dt>
                        <dd th:text="${showtime.screen.screenType}">2D</dd>
                        <dt>Giá thường</dt>
                        <dd th:text="${#numbers.formatInteger(showtime.basePrice, 1, 'COMMA')} + ' đ'">—</dd>
                        <dt>Giá VIP</dt>
                        <dd th:text="${#numbers.formatInteger(showtime.vipPrice, 1, 'COMMA')} + ' đ'">—</dd>
                    </dl>
                </div>

                <div class="card card-body" style="margin-top:16px">
                    <div style="font-weight:700;margin-bottom:12px">Tóm tắt đơn</div>
                    <div style="display:flex;justify-content:space-between;font-size:14px">
                        <span style="color:var(--text-dim)">Số ghế</span>
                        <strong id="seat-count">0</strong>
                    </div>
                    <div style="display:flex;justify-content:space-between;font-size:14px;margin-top:8px">
                        <span style="color:var(--text-dim)">Tạm tính</span>
                        <strong id="seat-total">0 đ</strong>
                    </div>

                    <form th:action="@{/checkout}" method="post" id="checkout-form" style="margin-top:18px">
                        <input type="hidden" name="showtimeId" th:value="${showtime.id}">
                        <input type="hidden" name="paymentMethod" value="cash">
                        <div id="seat-inputs"></div>
                        <button class="btn btn-primary btn-block" type="submit" id="checkout-btn" disabled>
                            Tiến hành thanh toán
                        </button>
                    </form>

                    <p style="color:var(--text-dim);font-size:12.5px;margin-top:12px">
                        Ghế được giữ trong 15 phút. Vui lòng đăng nhập để đặt vé.
                    </p>
                </div>
            </div>

            <div class="card card-body">
                <div class="seat-stage">Màn hình</div>

                <div class="seat-grid">
                    <div class="seat-row" th:each="row : ${seatMap.rows}">
                        <span class="seat-row-label" th:text="${row.label}">A</span>
                        <button type="button" class="seat"
                                th:each="seat : ${row.seats}"
                                th:classappend="${seat.type == 'vip' ? 'vip' : ''} + (${seat.taken} ? ' taken' : '')"
                                th:attr="data-seat-id=${seat.id},
                                         data-seat-label=${seat.label},
                                         data-seat-type=${seat.type},
                                         data-price=${seat.type == 'vip' ? seatMap.vipPrice : seatMap.standardPrice},
                                         disabled=${seat.taken}">1</button>
                    </div>
                </div>

                <div class="seat-legend">
                    <span><i class="legend-dot" style="background:var(--surface-2)"></i> Ghế thường</span>
                    <span><i class="legend-dot" style="background:transparent;border-color:#7cb0ff"></i> Ghế VIP</span>
                    <span><i class="legend-dot" style="background:var(--brand)"></i> Ghế đang chọn</span>
                    <span><i class="legend-dot" style="background:#3a3a4d;border-color:#3a3a4d"></i> Ghế đã bán</span>
                </div>
            </div>
        </div>
    </section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script th:src="@{/js/seats.js}"></script>

</body>
</html>
