<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Đăng nhập')}"></head>
<body>

<header th:replace="~{fragments/layout :: header('')}"></header>

<main class="container">
    <div class="auth-wrap">
        <div class="auth-head">
            <div class="logo" style="justify-content:center;font-size:26px">
                <span class="logo-mark">C</span><span>CineX</span>
            </div>
            <h1 style="margin-top:18px">Đăng nhập</h1>
            <p style="color:var(--text-dim);font-size:14px">Đăng nhập để đặt vé và quản lý vé của bạn</p>
        </div>

        <div class="flash flash-error" th:if="${param.error}">Email hoặc mật khẩu không đúng</div>
        <div class="flash flash-success" th:if="${param.logout}">Bạn đã đăng xuất khỏi tài khoản</div>
        <div class="flash flash-error" th:if="${param.denied}">Bạn không có quyền truy cập trang này</div>

        <div class="card card-body">
            <form th:action="@{/login}" method="post">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required autofocus placeholder="ban@email.com">
                </div>
                <div class="form-group">
                    <label for="password">Mật khẩu</label>
                    <input type="password" id="password" name="password" required placeholder="••••••••">
                </div>
                <button class="btn btn-primary btn-block" type="submit">Đăng nhập</button>
            </form>

            <div style="margin-top:18px;padding-top:18px;border-top:1px solid var(--border);
                        font-size:13px;color:var(--text-dim);text-align:center">
                Chưa có tài khoản?
                <a th:href="@{/register}" style="color:var(--brand-soft);font-weight:600">Đăng ký ngay</a>
            </div>

            <div style="margin-top:16px;padding:12px 14px;background:var(--bg-soft);border-radius:10px;
                        font-size:12.5px;color:var(--text-dim)">
                <strong style="color:var(--text)">Tài khoản demo</strong><br>
                Quản trị: admin@cinex.vn / admin123<br>
                Người dùng: user@cinex.vn / user123
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
