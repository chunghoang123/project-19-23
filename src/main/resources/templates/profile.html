<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Hồ sơ')}"></head>
<body>

<header th:replace="~{fragments/layout :: header('')}"></header>

<main class="container">
    <section class="section">
        <div class="section-head">
            <div>
                <h2 class="section-title">Hồ sơ cá nhân</h2>
                <p class="section-sub">Quản lý thông tin tài khoản của bạn</p>
            </div>
        </div>

        <div th:replace="~{fragments/layout :: flash}"></div>

        <div class="detail-layout">
            <div class="card card-body">
                <div style="display:flex;align-items:center;gap:16px;margin-bottom:18px">
                    <div class="avatar" style="width:58px;height:58px;font-size:22px"
                         th:text="${#strings.substring(user.name, 0, 1).toUpperCase()}">U</div>
                    <div>
                        <div style="font-weight:700;font-size:17px" th:text="${user.name}">Tên</div>
                        <div style="color:var(--text-dim);font-size:13px" th:text="${user.email}">Email</div>
                    </div>
                </div>

                <form th:action="@{/profile}" method="post">
                    <div class="form-group">
                        <label for="name">Họ và tên</label>
                        <input type="text" id="name" name="name" th:value="${user.name}" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" th:value="${user.email}" disabled>
                    </div>
                    <div class="form-group">
                        <label for="phone">Số điện thoại</label>
                        <input type="text" id="phone" name="phone" th:value="${user.phone}">
                    </div>
                    <button class="btn btn-primary" type="submit">Lưu thay đổi</button>
                </form>
            </div>

            <div class="card card-body">
                <div style="font-weight:700;margin-bottom:16px">Đổi mật khẩu</div>
                <form th:action="@{/profile/password}" method="post">
                    <div class="form-group">
                        <label for="oldPassword">Mật khẩu hiện tại</label>
                        <input type="password" id="oldPassword" name="oldPassword" required>
                    </div>
                    <div class="form-group">
                        <label for="newPassword">Mật khẩu mới</label>
                        <input type="password" id="newPassword" name="newPassword" required
                               placeholder="Tối thiểu 6 ký tự">
                    </div>
                    <button class="btn btn-outline" type="submit">Đổi mật khẩu</button>
                </form>

                <div style="margin-top:26px;padding-top:20px;border-top:1px solid var(--border);
                            font-size:13px;color:var(--text-dim)">
                    Tài khoản đăng ký ngày
                    <span th:text="${#temporals.format(user.createdAt, 'dd/MM/yyyy')}">—</span>
                    · Vai trò: <span th:text="${user.role.name}">user</span>
                </div>
            </div>
        </div>
    </section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
